<style>
  /* =====================================================================
     ANC LAB — Design tokens
     ===================================================================== */
  :root {
    /* v2.9.17 ธีม ANC: เขียวหัวเป็ด (teal-green) — สีสถานะ เขียว/แดง/ส้ม คงเดิม */
    --brand: #0f766e;          /* เขียวหัวเป็ด (ตัวขาวบนพื้นนี้ contrast 5.5:1) */
    --brand-600: #0b5d57;
    --brand-50: #e8f6f3;
    --brand-100: #c8ebe3;
    --brand-rgb: 15, 118, 110;
    --accent: #2f855a;         /* เขียวใบไม้ ใช้ใน gradient */
    --accent-50: #edf7f0;
    --ink: #17241f;            /* ตัวอักษรหลัก */
    --ink-2: #485a53;          /* ตัวอักษรรอง */
    --ink-3: #62736c;          /* คำอธิบาย */
    --line: #dfeae5;
    --line-2: #eef5f2;
    --bg: #f5faf8;
    --surface: #ffffff;
    --ok: #15803d;   --ok-bg: #e8f6ee;
    --bad: #c62828;  --bad-bg: #fdecec;
    --warn: #b45309; --warn-bg: #fff3e0;
    --info: #0e7490; --info-bg: #e4f5f8;
    --mute: #5b6475; --mute-bg: #eef1f5;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow-sm: 0 1px 2px rgba(16, 60, 50, .05), 0 2px 8px rgba(16, 60, 50, .03);
    --shadow: 0 2px 4px rgba(16, 60, 50, .05), 0 10px 28px rgba(16, 60, 50, .08);
    --sbw: 252px;
    --topbar-h: 60px;
    --font: 'IBM Plex Sans Thai', 'Sarabun', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --bs-body-font-family: var(--font);
    --bs-body-color: var(--ink);
    --bs-primary: var(--brand);
    --bs-primary-rgb: 15, 118, 110;
    --bs-link-color: var(--brand);
    --bs-link-color-rgb: 15, 118, 110;
    --bs-link-hover-color: var(--brand-600);
    --bs-border-color: var(--line);
  }
  html, body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 15px; -webkit-font-smoothing: antialiased; }
  a { text-decoration: none; }
  a:hover { text-decoration: underline; }
  .text-muted, .muted-sm { color: var(--ink-3) !important; }
  .muted-sm { font-size: .8rem; }
  :focus-visible { outline: 3px solid rgba(15, 118, 110, .35); outline-offset: 2px; }

  /* =====================================================================
     Buttons / forms
     ===================================================================== */
  .btn { font-size: .95rem; padding: .5rem 1rem; border-radius: var(--radius-sm); font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: .4rem; }
  .btn-sm { font-size: .88rem; padding: .38rem .75rem; border-radius: 8px; }
  .btn-lg { font-size: 1.05rem; padding: .7rem 1.2rem; }
  .btn-primary { --bs-btn-bg: var(--brand); --bs-btn-border-color: var(--brand); --bs-btn-hover-bg: var(--brand-600); --bs-btn-hover-border-color: var(--brand-600);
    --bs-btn-active-bg: var(--brand-600); --bs-btn-disabled-bg: var(--brand); --bs-btn-disabled-border-color: var(--brand); }
  .btn-outline-primary { --bs-btn-color: var(--brand); --bs-btn-border-color: var(--brand-100); --bs-btn-bg: #fff; --bs-btn-hover-bg: var(--brand-50); --bs-btn-hover-color: var(--brand-600); --bs-btn-hover-border-color: var(--brand-100); --bs-btn-active-bg: var(--brand-100); --bs-btn-active-color: var(--brand-600); }
  .btn-outline-secondary { --bs-btn-color: var(--ink-2); --bs-btn-border-color: var(--line); --bs-btn-bg: #fff; --bs-btn-hover-bg: var(--line-2); --bs-btn-hover-color: var(--ink); --bs-btn-hover-border-color: var(--line); --bs-btn-active-bg: var(--line); --bs-btn-active-color: var(--ink); }
  .btn-success { --bs-btn-bg: var(--ok); --bs-btn-border-color: var(--ok); --bs-btn-hover-bg: #116632; --bs-btn-hover-border-color: #116632; }
  .btn-light { --bs-btn-bg: #fff; --bs-btn-border-color: var(--line); }
  .btn-link { --bs-btn-color: var(--brand); text-decoration: none; }
  .btn-link:hover { text-decoration: underline; }
  .form-control, .form-select { border-color: var(--line); border-radius: var(--radius-sm); font-size: .95rem; padding: .5rem .8rem; color: var(--ink); }
  .form-select { padding-right: 2.2rem; }
  .form-control-sm, .form-select-sm { font-size: .9rem; border-radius: 8px; padding-top: .38rem; padding-bottom: .38rem; }
  .form-control-lg { font-size: 1rem; padding: .7rem .9rem; }
  .form-control:focus, .form-select:focus { border-color: #8fd0c3; box-shadow: 0 0 0 .2rem rgba(15, 118, 110, .14); }
  .form-label { font-weight: 500; color: var(--ink-2); }
  .form-label.small, label.small { font-size: .82rem; }
  .form-check-input { border-color: #b6cdc5; }
  .form-check-input:checked { background-color: var(--brand); border-color: var(--brand); }
  .input-icon { position: relative; }
  .input-icon > i { position: absolute; left: .9rem; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
  .input-icon > .form-control { padding-left: 2.5rem; }
  .icon-btn { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); background: #fff; border-radius: 10px; color: var(--ink-2); font-size: 1.25rem; }
  .icon-btn:hover { background: var(--line-2); color: var(--ink); }

  /* =====================================================================
     Login
     ===================================================================== */
  .login-wrap { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); background: var(--surface); }
  .login-brand { position: relative; overflow: hidden; color: #fff; display: flex; align-items: center; padding: 3rem 4rem;
    background: radial-gradient(900px 480px at -10% 110%, rgba(167, 243, 208, .30), transparent 60%), radial-gradient(600px 400px at 110% 10%, rgba(125, 211, 252, .22), transparent 60%), linear-gradient(150deg, #0f766e 0%, #0e6a5a 50%, #14532d 100%); }
  .login-brand::after { content: ''; position: absolute; right: -120px; top: -120px; width: 380px; height: 380px; border-radius: 50%; border: 60px solid rgba(255, 255, 255, .06); }
  .login-brand-inner { position: relative; z-index: 1; max-width: 460px; }
  .login-brand-logo { width: 84px; height: 84px; border-radius: 50%; background: #fff; padding: 6px; object-fit: contain; box-shadow: 0 8px 24px rgba(0, 0, 0, .18); }
  .login-brand h1 { font-size: 2.1rem; font-weight: 700; line-height: 1.2; margin: 1.6rem 0 .6rem; letter-spacing: -.01em; }
  .login-brand p { opacity: .85; margin-bottom: 2rem; font-size: 1.02rem; }
  .login-points { list-style: none; padding: 0; margin: 0; display: grid; gap: .9rem; }
  .login-points li { display: flex; gap: .8rem; align-items: center; font-size: .98rem; }
  .login-points i { width: 38px; height: 38px; flex: 0 0 38px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: rgba(255, 255, 255, .13); font-size: 1.1rem; }
  .login-panel { display: flex; align-items: center; justify-content: center; padding: 2rem 1.25rem; background: var(--bg); }
  .login-card { width: 100%; max-width: 400px; background: #fff; border-radius: 20px; padding: 2.4rem 2.2rem 1.8rem; box-shadow: var(--shadow); border: 1px solid var(--line); }
  .login-title { font-size: 1.5rem; font-weight: 700; margin-bottom: .25rem; }
  .login-sub { color: var(--ink-3); margin-bottom: 1.6rem; }
  .login-mobile-head { display: none; text-align: center; margin-bottom: 1.5rem; }
  .login-logo-img { width: 76px; height: 76px; object-fit: contain; display: block; margin: 0 auto; }
  .pw-toggle { position: absolute; right: .35rem; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--ink-3); width: 40px; height: 40px; border-radius: 8px; }
  .pw-toggle:hover { color: var(--ink); background: var(--line-2); }
  #loginPass { padding-right: 3rem; }
  .caps-hint { color: var(--warn); font-size: .82rem; margin-top: .35rem; }
  .login-foot { margin-top: 1.6rem; padding-top: 1rem; border-top: 1px solid var(--line-2); font-size: .8rem; color: var(--ink-3); text-align: center; }
  @media (max-width: 899.98px) {
    .login-wrap { grid-template-columns: 1fr; }
    .login-brand { display: none; }
    .login-mobile-head { display: block; }
    .login-card { padding: 2rem 1.4rem 1.4rem; }
  }

  /* =====================================================================
     App shell
     ===================================================================== */
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: var(--sbw); flex: 0 0 var(--sbw); background: var(--surface); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; transition: width .18s, flex-basis .18s; z-index: 1040; }
  .sb-brand { display: flex; align-items: center; gap: .65rem; padding: 0 .75rem 0 1rem; height: var(--topbar-h); border-bottom: 1px solid var(--line-2); flex-shrink: 0; }
  .brand-logo { width: 36px; height: 36px; border-radius: 50%; object-fit: contain; flex-shrink: 0; background: #fff; box-shadow: 0 0 0 1px var(--line); }
  .sb-brand-text { min-width: 0; flex: 1; line-height: 1.15; }
  .sb-brand-text .t1 { font-weight: 700; font-size: 1.02rem; color: var(--ink); letter-spacing: .01em; }
  .sb-brand-text .t2 { font-size: .75rem; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb-btn { border: 0; background: transparent; color: var(--ink-3); border-radius: 8px; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0; }
  .sb-btn:hover { background: var(--line-2); color: var(--brand); }
  .sb-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: .6rem .6rem 1rem; }
  .sidebar .nav-link { color: var(--ink-2); border-radius: 10px; padding: .55rem .75rem; display: flex; gap: .7rem; align-items: center; white-space: nowrap; font-weight: 500; font-size: .93rem; position: relative; }
  .sidebar .nav-link i { font-size: 1.12rem; flex-shrink: 0; width: 1.3rem; text-align: center; color: var(--ink-3); }
  .sidebar .nav-link .lbl { overflow: hidden; text-overflow: ellipsis; }
  .sidebar .nav-link:hover { background: var(--line-2); color: var(--ink); text-decoration: none; }
  .sidebar .nav-link.active { background: var(--brand-50); color: var(--brand); }
  .sidebar .nav-link.active i { color: var(--brand); }
  .sidebar .nav-link.active::before { content: ''; position: absolute; left: -.6rem; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--brand); }
  .sidebar .menu-head { font-size: .72rem; font-weight: 600; color: var(--ink-3); padding: 1rem .75rem .35rem; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb-resizer { position: fixed; top: 0; bottom: 0; width: 7px; margin-left: -4px; cursor: col-resize; z-index: 1045; }
  .sb-resizer:hover, .sb-resizer.dragging { background: rgba(15, 118, 110, .16); }
  body.sb-dragging { cursor: col-resize; user-select: none; }
  body.sb-collapsed .sidebar { width: 72px; flex-basis: 72px; }
  body.sb-collapsed .sidebar .lbl, body.sb-collapsed .sidebar .menu-head, body.sb-collapsed .sb-brand-text { display: none; }
  body.sb-collapsed .sb-brand { flex-direction: column; justify-content: center; gap: .2rem; padding: 0; }
  body.sb-collapsed .sb-brand .brand-logo { width: 30px; height: 30px; }
  body.sb-collapsed .sb-brand .sb-btn { height: 20px; }
  body.sb-collapsed .sidebar .nav-link { justify-content: center; padding: .65rem 0; }
  body.sb-collapsed .sidebar .menu-head { display: block; height: 1px; padding: 0; margin: .6rem .5rem; background: var(--line); }
  body.sb-collapsed .sb-resizer { display: none; }
  .sb-backdrop { display: none; }
  .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 1030; height: var(--topbar-h); display: flex; align-items: center; gap: .75rem; padding: 0 1.5rem;
    background: rgba(255, 255, 255, .88); backdrop-filter: saturate(160%) blur(8px); border-bottom: 1px solid var(--line); }
  .topbar-crumb { min-width: 0; }
  .breadcrumb { font-size: .9rem; flex-wrap: nowrap; }
  .breadcrumb-item { white-space: nowrap; color: var(--ink-3); }
  .breadcrumb-item.active { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .user-chip { display: flex; align-items: center; gap: .6rem; border: 1px solid transparent; background: transparent; border-radius: 12px; padding: .3rem .5rem .3rem .35rem; text-align: left; }
  .user-chip:hover, .user-chip[aria-expanded="true"] { background: var(--line-2); border-color: var(--line); }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--brand-50); color: var(--brand); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: .95rem; flex-shrink: 0; }
  .user-meta { line-height: 1.2; max-width: 240px; }
  .user-meta .n { display: block; font-weight: 600; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-meta .o { display: block; font-size: .76rem; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .role-pill { display: inline-block; background: var(--brand-50); color: var(--brand); font-weight: 600; border-radius: 999px; padding: .15rem .6rem; }
  .dropdown-menu { border-color: var(--line); border-radius: 12px; padding: .4rem; font-size: .93rem; }
  .dropdown-item { border-radius: 8px; padding: .45rem .7rem; }
  .content { padding: 1.5rem 1.75rem 3rem; min-width: 0; flex: 1; }
  #page { max-width: 1600px; }
  @media (max-width: 991.98px) {
    .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-105%); transition: transform .22s ease; width: 280px !important; flex-basis: 280px !important; box-shadow: 0 10px 40px rgba(0, 0, 0, .18); }
    .sidebar.show { transform: none; }
    .sidebar.show ~ .sb-backdrop { display: block; position: fixed; inset: 0; background: rgba(15, 23, 42, .4); z-index: 1035; }
    .sb-resizer, #sbCollapse { display: none !important; }
    body.sb-collapsed .sidebar .lbl, body.sb-collapsed .sb-brand-text { display: revert; }
    body.sb-collapsed .sidebar .menu-head { display: block; height: auto; padding: 1rem .75rem .35rem; margin: 0; background: none; }
    body.sb-collapsed .sb-brand { flex-direction: row; justify-content: flex-start; padding: 0 .75rem 0 1rem; }
    body.sb-collapsed .sidebar .nav-link { justify-content: flex-start; padding: .55rem .75rem; }
    .topbar { padding: 0 .9rem; }
    .content { padding: 1rem .85rem 6rem; }
  }

  /* =====================================================================
     Page header / cards
     ===================================================================== */
  .page-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: .75rem 1rem; margin-bottom: 1.25rem; }
  .page-head .ph-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--brand-50); color: var(--brand); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
  .page-head h2 { font-size: 1.35rem; font-weight: 700; margin: 0; letter-spacing: -.005em; }
  .page-head .ph-sub { color: var(--ink-3); font-size: .88rem; margin-top: .15rem; }
  .page-head .ph-actions { display: flex; flex-wrap: wrap; gap: .5rem; }
  .card { border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); background: var(--surface); }
  .card-title-row { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .9rem 1.1rem .5rem; }
  .card-title-row h3 { font-size: 1rem; font-weight: 600; margin: 0; }
  .section-label { font-size: .82rem; font-weight: 600; color: var(--ink-2); margin: 1.6rem 0 .65rem; display: flex; align-items: center; gap: .45rem; }
  .section-label:first-child { margin-top: 0; }
  .section-label .hint { font-weight: 400; color: var(--ink-3); }

  /* =====================================================================
     Dashboard
     ===================================================================== */
  .hero { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.4rem; }
  .hero h2 { font-size: 1.45rem; font-weight: 700; margin: 0; }
  .hero .sub { color: var(--ink-3); font-size: .9rem; margin-top: .15rem; }
  .todo-card { display: flex; flex-direction: column; gap: .4rem; height: 100%; padding: 1rem 1.1rem; border-radius: var(--radius); border: 1px solid var(--line); background: #fff;
    color: inherit; text-align: left; width: 100%; box-shadow: var(--shadow-sm); transition: transform .12s, box-shadow .12s, border-color .12s; position: relative; overflow: hidden; }
  .todo-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--tone, var(--brand)); }
  button.todo-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: #d3dbe7; }
  .todo-card .tc-top { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
  .todo-card .tc-icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--tone-bg, var(--brand-50)); color: var(--tone, var(--brand)); }
  .todo-card .tc-num { font-size: 1.9rem; font-weight: 700; line-height: 1; color: var(--ink); }
  .todo-card .tc-lbl { font-weight: 600; font-size: .95rem; }
  .todo-card .tc-help { font-size: .8rem; color: var(--ink-3); }
  .todo-card .tc-go { font-size: .82rem; color: var(--tone, var(--brand)); font-weight: 600; margin-top: auto; }
  .todo-card.zero { --tone: var(--ok); --tone-bg: var(--ok-bg); }
  .todo-card.zero .tc-num { color: var(--ink-3); }
  .tone-bad { --tone: var(--bad); --tone-bg: var(--bad-bg); }
  .tone-warn { --tone: var(--warn); --tone-bg: var(--warn-bg); }
  .tone-info { --tone: var(--brand); --tone-bg: var(--brand-50); }
  .card.stat, .card.kpi { flex-direction: row; }
  .stat { padding: 1rem 1.1rem; height: 100%; display: flex; gap: .85rem; align-items: center; }
  .min-w-0 { min-width: 0; }
  .stat .icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; flex-shrink: 0; }
  .stat .val { font-size: 1.55rem; font-weight: 700; line-height: 1.1; }
  .stat .lbl { font-size: .84rem; color: var(--ink-3); line-height: 1.3; }
  .stat .val small { font-size: .8rem; font-weight: 500; color: var(--ink-3); margin-left: .2rem; }
  .ic-blue { background: var(--brand-50); color: var(--brand); }
  .ic-green { background: var(--ok-bg); color: var(--ok); }
  .ic-red { background: var(--bad-bg); color: var(--bad); }
  .ic-amber { background: var(--warn-bg); color: var(--warn); }
  .ic-gray { background: var(--mute-bg); color: var(--mute); }
  .ic-teal { background: var(--info-bg); color: var(--info); }
  /* แถบสัดส่วน */
  .split { padding: 1.1rem 1.2rem 1.2rem; height: 100%; }
  .split h3 { font-size: 1rem; font-weight: 600; margin: 0 0 .15rem; }
  .split .sub { font-size: .82rem; color: var(--ink-3); margin-bottom: .9rem; }
  .split-bar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--line-2); gap: 2px; }
  .split-bar span { display: block; height: 100%; min-width: 4px; }
  .split-legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: .6rem; margin-top: 1rem; }
  .split-legend .it { display: flex; flex-direction: column; gap: .1rem; padding: .55rem .7rem; border-radius: 10px; background: var(--bg); border: 0; text-align: left; color: inherit; }
  .split-legend button.it:hover { background: var(--line-2); }
  .split-legend .it .k { font-size: .8rem; color: var(--ink-2); display: flex; align-items: center; gap: .4rem; }
  .split-legend .it .k::before { content: ''; width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex-shrink: 0; }
  .split-legend .it .v { font-size: 1.25rem; font-weight: 700; }
  .split-legend .it .v small { font-size: .78rem; font-weight: 500; color: var(--ink-3); margin-left: .25rem; }
  .chart-box { position: relative; height: 230px; }
  .chart-card { padding: 1rem 1.1rem !important; }
  .chart-card .chart-title { font-size: .95rem; font-weight: 600; margin-bottom: .1rem; }
  .chart-card .chart-sub { font-size: .78rem; color: var(--ink-3); margin-bottom: .6rem; }
  .sys-strip { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1.4rem; padding: .85rem 1.1rem; font-size: .88rem; }
  .sys-strip .it { display: flex; align-items: center; gap: .4rem; color: var(--ink-2); }
  .sys-strip b { color: var(--ink); }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-bg); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); }
  .alert { border-radius: var(--radius-sm); }
  .alert-stale { border: 1px solid #f6d7a7; background: var(--warn-bg); color: #7a3e06; }
  /* (คงไว้เพื่อความเข้ากันได้) */
  .kpi { padding: .8rem .9rem; display: flex; gap: .7rem; align-items: center; height: 100%; }
  .kpi .icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .kpi .val { font-size: 1.3rem; font-weight: 700; line-height: 1.1; }
