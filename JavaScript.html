<script>
(function () {
  'use strict';

  // =====================================================================
  // State & helpers
  // =====================================================================
  const S = { token: null, user: null, charts: [], page: null, opts: null, loginAt: null };
  const TOKEN_KEY = 'anc_lab_token';

  const ROLE_TH = { SUPER_ADMIN: 'Super Admin (ผู้ดูแลระบบระดับสูง)', HOSPITAL_ADMIN: 'Admin โรงพยาบาลแม่ข่าย', PCU_STAFF: 'เจ้าหน้าที่ รพ.สต.', AUDITOR: 'ผู้ตรวจสอบระบบ' };
  const RISK_TH = { NORMAL: 'ปกติ', RISK: 'เสี่ยง', PENDING: 'รอผลตรวจ', UNKNOWN: 'ไม่มีข้อมูล', OTHER: 'อื่นๆ' };
  const VER_TH = { VERIFIED: 'ยืนยันผลแล้ว', PRELIMINARY: 'ผลเบื้องต้น', UNKNOWN: 'ไม่ทราบสถานะยืนยัน' };
  const FU_TH = { PENDING: 'รอติดตาม', IN_PROGRESS: 'กำลังติดตาม', DONE: 'ติดตามแล้ว', CANCELLED: 'ยกเลิก' };
  const LINK_TH = { PENDING: 'รอตรวจสอบการเชื่อมโยง', VERIFIED: 'ยืนยันความสัมพันธ์แล้ว', REJECTED: 'ปฏิเสธ' };
  const PERSON_TH = { PREGNANT: 'หญิงตั้งครรภ์', PARTNER: 'สามี' };
  const NOTE_TH = { INFO: 'แจ้งเพื่อทราบ', ABNORMAL_LAB: 'ผล LAB ผิดปกติ', FOLLOWUP: 'ติดตามเคส', RETEST: 'นัดตรวจซ้ำ / ตรวจเพิ่ม', PARTNER: 'ติดตามสามีมาตรวจ', URGENT: 'เร่งด่วน', OTHER: 'อื่นๆ' };
  const FLAG_TH = { H: 'สูงกว่าค่าปกติ', L: 'ต่ำกว่าค่าปกติ', A: 'ผิดปกติ' };
  const HOSP_REASON_TH = { DOCTOR: 'แพทย์ต้องการแจ้งผลด้วยตนเอง', COUNSEL: 'ต้องให้คำปรึกษาก่อน/หลังแจ้งผล', RETEST: 'ต้องตรวจเพิ่มเติม / ตรวจซ้ำที่ รพ.แม่ข่าย', COUPLE: 'นัดสามี/คู่มาฟังผลพร้อมกัน', OTHER: 'อื่น ๆ' };
  const REF_TH = { NOT_SENT: 'ยังไม่ส่งต่อ', SENT: 'ส่งแล้ว รอรับทราบ', ACKNOWLEDGED: 'รพ.สต. รับทราบแล้ว', RECALLED: 'ยกเลิก/ย้าย' };
  const isAdminRole = () => S.user && (S.user.Role === 'SUPER_ADMIN' || S.user.Role === 'HOSPITAL_ADMIN');
  const isPcuRole = () => S.user && S.user.Role === 'PCU_STAFF';
  const TH_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  const COLORS = ['#0f766e', '#2f855a', '#0e7490', '#84cc16', '#e0a100', '#d35400', '#c2577f', '#5d6d7e', '#8a8f98', '#6366f1'];

  function esc(v) {
    return String(v === undefined || v === null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  function fmtDate(iso) {
    const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return '-';
    return parseInt(m[3], 10) + ' ' + TH_MONTHS[parseInt(m[2], 10) - 1] + ' ' + (parseInt(m[1], 10) + 543);
  }
  function fmtDateTime(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return esc(iso);
    return fmtDate(isoDate(d)) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function isoDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function daysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); return isoDate(d); }

  // =====================================================================
  // ช่องกรอกวันที่แบบ วัน/เดือน/ปี พ.ศ.
  // แปลง <input type="date"> ทุกช่อง (รวมใน SweetAlert) อัตโนมัติ:
  //   ช่องเดิมกลายเป็น hidden เก็บค่า yyyy-MM-dd (ค.ศ.) เหมือนเดิม → โค้ดส่วนอื่น/Server ไม่ต้องแก้
  //   ผู้ใช้เห็น/พิมพ์เป็น dd/mm/yyyy (พ.ศ.) + ปฏิทินเลือกวัน
  // =====================================================================
  const TH_MONTHS_FULL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  const TH_DOW = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
  const VALUE_DESC = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');

  /** yyyy-MM-dd → dd/mm/yyyy (พ.ศ.) */
  function isoToBe(iso) {
    const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[3] + '/' + m[2] + '/' + (parseInt(m[1], 10) + 543) : '';
  }
  /** ข้อความที่ผู้ใช้พิมพ์ → yyyy-MM-dd ('' = ว่าง, null = ไม่ถูกต้อง)
   *  รับ 1/11/2569, 01-11-69, 1.11.2569, 01112569 · ปี 2 หลัก = 25xx · ปี < 2400 ถือเป็น ค.ศ. */
  function beToIso(text) {
    const t = String(text || '').trim();
    if (!t) return '';
    let m = t.match(/^(\d{1,2})\s*[\/\-.\s]\s*(\d{1,2})\s*[\/\-.\s]\s*(\d{2}|\d{4})$/) || t.match(/^(\d{2})(\d{2})(\d{4})$/);
    if (!m) return null;
    const d = parseInt(m[1], 10), mo = parseInt(m[2], 10);
    let y = parseInt(m[3], 10);
    if (m[3].length === 2) y += 2500;
    if (y >= 2400) y -= 543;
    if (y < 1900 || y > 2200 || mo < 1 || mo > 12 || d < 1) return null;
    const dt = new Date(y, mo - 1, d);
    if (dt.getMonth() !== mo - 1) return null;
    return isoDate(dt);
  }

  let THD_POP = null; // ปฏิทินที่เปิดอยู่ (มีได้ทีละอัน)
  function thdClose() {
    if (!THD_POP) return;
    THD_POP.el.remove();
    document.removeEventListener('mousedown', THD_POP.outside, true);
    window.removeEventListener('resize', thdClose);
    window.removeEventListener('scroll', THD_POP.onScroll, true);
    THD_POP = null;
  }

  function enhanceDateInput(inp) {
    if (inp.dataset.thd) return;
    inp.dataset.thd = '1';
    const wrap = document.createElement('div');
    wrap.className = 'thd-wrap';
    if (inp.getAttribute('style')) wrap.setAttribute('style', inp.getAttribute('style'));
    const txt = document.createElement('input');
    txt.type = 'text';
    txt.className = (inp.className || 'form-control') + ' thd-text';
    txt.placeholder = 'วว/ดด/ปปปป';
    txt.autocomplete = 'off';
    txt.setAttribute('inputmode', 'numeric');
    txt.setAttribute('aria-label', (inp.getAttribute('aria-label') || 'วันที่') + ' (วัน/เดือน/ปี พ.ศ.)');
    if (inp.id) { txt.id = inp.id + '__th'; $$('label[for="' + inp.id + '"]').forEach((l) => l.setAttribute('for', txt.id)); }
    if (inp.disabled) txt.disabled = true;
    if (inp.required) txt.required = true;
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'thd-btn'; btn.tabIndex = -1;
    btn.setAttribute('aria-label', 'เปิดปฏิทิน');
    btn.innerHTML = '<i class="bi bi-calendar3"></i>';

    inp.parentNode.insertBefore(wrap, inp);
    wrap.appendChild(txt); wrap.appendChild(btn); wrap.appendChild(inp);
    inp.type = 'hidden';
    inp.removeAttribute('style');

    // ตั้งค่า .value จากโค้ดเดิม (เช่น ปุ่มวันก่อน/ถัดไป) → ช่องที่แสดงอัปเดตตาม
    Object.defineProperty(inp, 'value', {
      configurable: true,
      get() { return VALUE_DESC.get.call(inp); },
      set(v) { VALUE_DESC.set.call(inp, v); txt.value = isoToBe(v); }
    });
    txt.value = isoToBe(inp.value);

    function setIso(iso) {
      const changed = iso !== inp.value;
      inp.value = iso;
      txt.classList.remove('is-invalid');
      if (changed) inp.dispatchEvent(new Event('change', { bubbles: true }));
    }
    function commit() {
      const iso = beToIso(txt.value);
      if (iso === null) {
        txt.classList.add('is-invalid');
        txt.title = 'รูปแบบวันที่ไม่ถูกต้อง ใช้ วัน/เดือน/ปี พ.ศ. เช่น 1/11/2569';
        return false;
      }
      txt.title = '';
      setIso(iso);
      return true;
    }
    txt.addEventListener('change', (e) => { e.stopPropagation(); commit(); });
    txt.addEventListener('blur', () => { if (txt.classList.contains('is-invalid')) { txt.value = isoToBe(inp.value); txt.classList.remove('is-invalid'); } });
    txt.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { if (!commit()) e.preventDefault(); thdClose(); }
      else if (e.key === 'Escape' && THD_POP) { e.stopPropagation(); e.preventDefault(); thdClose(); }
      else if (e.key === 'ArrowDown' && e.altKey) { e.preventDefault(); open(); }
    });
    txt.addEventListener('input', () => {
      // ใส่ / ให้อัตโนมัติขณะพิมพ์ตัวเลข: 01 → 01/ , 01/11 → 01/11/
      const v = txt.value;
      if (/^\d{2}$/.test(v) || /^\d{1,2}\/\d{2}$/.test(v)) txt.value = v + '/';
    });
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => { if (THD_POP && THD_POP.txt === txt) thdClose(); else { txt.focus(); open(); } });
    txt.addEventListener('click', () => { if (!THD_POP || THD_POP.txt !== txt) open(); });

    function open() {
      thdClose();
      if (txt.disabled) return;
      const cur = beToIso(txt.value) || inp.value || isoDate(new Date());
      let vy = parseInt(cur.slice(0, 4), 10), vm = parseInt(cur.slice(5, 7), 10) - 1;
      const el = document.createElement('div');
      el.className = 'thd-pop shadow';
      el.addEventListener('mousedown', (e) => { if (e.target.tagName !== 'SELECT') e.preventDefault(); });
      document.body.appendChild(el);

      function draw() {
        const sel = inp.value, today = isoDate(new Date());
        const thisY = new Date().getFullYear();
        let yMin = Math.min(thisY - 30, vy), yMax = Math.max(thisY + 10, vy);
        let ys = '';
        for (let y = yMax; y >= yMin; y--) ys += '<option value="' + y + '"' + (y === vy ? ' selected' : '') + '>' + (y + 543) + '</option>';
        const first = new Date(vy, vm, 1).getDay(), nDays = new Date(vy, vm + 1, 0).getDate();
        let cells = '';
        for (let i = 0; i < first; i++) cells += '<span></span>';
        for (let d = 1; d <= nDays; d++) {
          const iso = vy + '-' + String(vm + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
          cells += '<button type="button" data-d="' + iso + '" class="' + (iso === sel ? 'sel ' : '') + (iso === today ? 'today' : '') + '">' + d + '</button>';
        }
        el.innerHTML =
          '<div class="thd-head"><button type="button" data-nav="-1" aria-label="เดือนก่อน">‹</button>' +
          '<select data-m>' + TH_MONTHS_FULL.map((n, i) => '<option value="' + i + '"' + (i === vm ? ' selected' : '') + '>' + n + '</option>').join('') + '</select>' +
          '<select data-y>' + ys + '</select>' +
          '<button type="button" data-nav="1" aria-label="เดือนถัดไป">›</button></div>' +
          '<div class="thd-grid">' + TH_DOW.map((w) => '<b>' + w + '</b>').join('') + cells + '</div>' +
          '<div class="thd-foot"><button type="button" data-today>วันนี้</button><button type="button" data-clear>ล้าง</button></div>';
        el.querySelector('[data-m]').addEventListener('change', (e) => { vm = parseInt(e.target.value, 10); draw(); });
        el.querySelector('[data-y]').addEventListener('change', (e) => { vy = parseInt(e.target.value, 10); draw(); });
      }
      el.addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        if (b.dataset.nav) { vm += parseInt(b.dataset.nav, 10); if (vm < 0) { vm = 11; vy--; } if (vm > 11) { vm = 0; vy++; } draw(); return; }
        if (b.dataset.d) { setIso(b.dataset.d); thdClose(); return; }
        if (b.hasAttribute('data-today')) { setIso(isoDate(new Date())); thdClose(); return; }
        if (b.hasAttribute('data-clear')) { setIso(''); txt.value = ''; thdClose(); }
      });
      draw();

      function place() {
        const r = txt.getBoundingClientRect();
        const h = el.offsetHeight, w = el.offsetWidth;
        let top = r.bottom + 4;
        if (top + h > window.innerHeight - 4 && r.top - h - 4 > 0) top = r.top - h - 4;
        el.style.top = top + 'px';
        el.style.left = Math.max(4, Math.min(r.left, window.innerWidth - w - 4)) + 'px';
      }
      place();
      THD_POP = {
        el: el, txt: txt,
        outside: (e) => { if (!el.contains(e.target) && !wrap.contains(e.target)) thdClose(); },
        onScroll: (e) => { if (!el.contains(e.target)) place(); }
      };
      document.addEventListener('mousedown', THD_POP.outside, true);
      window.addEventListener('resize', thdClose);
      window.addEventListener('scroll', THD_POP.onScroll, true);
    }
  }
  function enhanceDates(root) {
    if (root.matches && root.matches('input[type="date"]')) enhanceDateInput(root);
    if (root.querySelectorAll) $$('input[type="date"]', root).forEach(enhanceDateInput);
  }
  new MutationObserver((muts) => {
    muts.forEach((m) => m.addedNodes.forEach((n) => { if (n.nodeType === 1) enhanceDates(n); }));
    if (THD_POP && !document.body.contains(THD_POP.txt)) thdClose();
  }).observe(document.body, { childList: true, subtree: true });
  enhanceDates(document.body);

  /** v3.0.0 'Lab ANC ครั้งที่ 1' → 'ANC ครั้งที่ 1' (ป้ายจาก ANC_CODES ฝั่ง Server) */
  function ancShort(label) { return String(label || '').replace(/^Lab\s*/i, ''); }
  function riskBadge(risk, text) {
    return '<span class="badge badge-status st-' + esc(risk || 'UNKNOWN') + '">' + esc(text || RISK_TH[risk] || '-') + '</span>';
  }
  function verBadge(v) {
    v = v || 'UNKNOWN';
    return '<span class="badge badge-status st-' + (v === 'UNKNOWN' ? 'UNVERIFIED' : esc(v)) + '">' + esc(VER_TH[v] || v) + '</span>';
  }
  function fuBadge(s) {
    if (!s) return '<span class="muted-sm">-</span>';
    const cls = s === 'DONE' ? 'st-NORMAL' : s === 'CANCELLED' ? 'st-UNKNOWN' : 'st-PENDING';
    return '<span class="badge badge-status ' + cls + '">' + esc(FU_TH[s] || s) + '</span>';
  }
  function linkBadge(s) {
    if (!s) return '<span class="badge badge-status st-UNKNOWN">ยังไม่เชื่อมโยง</span>';
    const cls = s === 'VERIFIED' ? 'st-NORMAL' : s === 'REJECTED' ? 'st-RISK' : 'st-PENDING';
    return '<span class="badge badge-status ' + cls + '">' + esc(LINK_TH[s] || s) + '</span>';
  }

  /** v2.9.26 ป้าย "ฟังผลที่ รพ.แม่ข่าย" + เหตุผล (ใช้ในรายการ) */
  function hospTag(h, withReason) {
    if (!h) return '';
    return '<div class="hosp-tag" title="' + esc(h.reasonLabel + (h.reason ? ': ' + h.reason : '')) + '"><i class="bi bi-hospital"></i> ฟังผลที่ รพ.แม่ข่าย</div>' +
      (withReason ? '<div class="hosp-why">' + esc(h.reasonCode === 'OTHER' ? h.reason : h.reasonLabel + (h.reason ? ' · ' + h.reason : '')) +
        (h.apptDate ? '<div><i class="bi bi-calendar-event"></i> นัด ' + fmtDate(h.apptDate) + '</div>' : '') + '</div>' : '');
  }

  function refBadge(ref, compact) {
    if (!ref) return '<span class="badge badge-status st-UNKNOWN">ยังไม่ส่งต่อ</span>';
    if (isPcuRole()) {
      return '<span class="ref-cell">' + (ref.Status === 'SENT' ? '<span class="badge badge-status has-icon st-RISK"><i class="bi bi-bell-fill"></i> เคสใหม่ รอรับทราบ</span>'
        : '<span class="badge badge-status st-NORMAL">รับทราบแล้ว</span>') + hospTag(ref.hospital, true) + '</span>';
    }
    if (compact) {
      const cls = ref.Status === 'ACKNOWLEDGED' ? 'st-NORMAL' : 'st-PENDING';
      return '<span class="badge badge-status ' + cls + '">' + (ref.Status === 'ACKNOWLEDGED' ? 'รพ.สต. รับทราบแล้ว' : 'ส่งแล้ว รอรับทราบ') + '</span>';
    }
    return '<span class="ref-cell"><span class="badge badge-status st-SENT">ส่งแล้ว</span>' +
      '<div class="muted-sm">→ ' + esc(String(ref.PCUName || '').replace('โรงพยาบาลส่งเสริมสุขภาพตำบล', 'รพ.สต.')) + '</div>' +
      '<div class="muted-sm">' + fmtDate(String(ref.SentAt || '').slice(0, 10)) + '</div>' + hospTag(ref.hospital, false) + '</span>';
  }

  /** คอลัมน์ "รพ.สต. รับทราบผล LAB" (หน้า Admin) */
  function ackBadge(ref) {
    if (!ref) return '<span class="muted-sm">—</span>';
    if (ref.Status === 'ACKNOWLEDGED') {
      return '<span class="badge badge-status has-icon st-NORMAL"><i class="bi bi-check2-circle"></i> รับทราบแล้ว</span>' +
        '<div class="muted-sm">' + fmtDateTime(ref.AckAt) + '</div>' + (ref.AckByName ? '<div class="muted-sm">' + esc(ref.AckByName) + '</div>' : '');
    }
    return '<span class="badge badge-status has-icon st-PENDING"><i class="bi bi-hourglass-split"></i> ยังไม่รับทราบ</span>';
  }

  const loadingHtml = (msg) => '<div class="empty-state"><div class="spinner-border text-primary mb-2"></div><div>' + esc(msg || 'กำลังโหลดข้อมูล...') + '</div></div>';
  const emptyHtml = (msg, hint) => '<div class="empty-state"><i class="bi bi-inbox"></i><div class="fw-semibold text-body">' + esc(msg || 'ไม่พบข้อมูล') + '</div>' +
    (hint ? '<div class="small mt-1">' + esc(hint) + '</div>' : '') + '</div>';
  const errorHtml = (msg) => '<div class="empty-state text-danger"><i class="bi bi-exclamation-triangle"></i><div class="fw-semibold">เกิดข้อผิดพลาด</div><div class="small mt-1">' + esc(msg) + '</div>' +
    '<div class="mt-3"><button class="btn btn-outline-primary btn-sm" data-act="reload">ลองใหม่</button></div></div>';

  function toast(msg, icon) {
    Swal.fire({ toast: true, position: 'top-end', timer: 2500, showConfirmButton: false, icon: icon || 'success', title: msg });
  }

  // ---------------------------------------------------------------------
  // RPC
  // ---------------------------------------------------------------------
  function api(action, params) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.ok) return resolve(res.data);
          const err = new Error(res && res.message ? res.message : 'เกิดข้อผิดพลาด');
          err.code = res && res.code;
          if (err.code === 'AUTH_REQUIRED') { forceLogout(err.message); }
          reject(err);
        })
        .withFailureHandler((e) => reject(new Error('ไม่สามารถติดต่อเซิร์ฟเวอร์ได้: ' + (e && e.message ? e.message : e))))
        .rpc(S.token, action, params || {});
    });
  }

  function saveToken(t) { try { t ? sessionStorage.setItem(TOKEN_KEY, t) : sessionStorage.removeItem(TOKEN_KEY); } catch (e) { /* storage blocked */ } }
  function readToken() { try { return sessionStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }

  /** v2.9.18 คำสั่งที่ไม่ต้องเข้าสู่ระบบ (สมัครสมาชิก) */
  function rpcPub(action, params) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler((res) => (res && res.ok ? resolve(res.data) : reject(new Error(res && res.message ? res.message : 'เกิดข้อผิดพลาด'))))
        .withFailureHandler((e) => reject(new Error('ไม่สามารถติดต่อเซิร์ฟเวอร์ได้: ' + (e && e.message ? e.message : e))))
        .rpcPublic(action, params || {});
    });
  }

  // ---------- เลขบัตรประชาชน 13 หลัก ----------
  const cidDigits = (v) => String(v || '').replace(/\D/g, '').slice(0, 13);
  function isCid(v) {
    const d = cidDigits(v);
    if (d.length !== 13) return false;
    let sum = 0;
    for (let i = 0; i < 12; i++) sum += Number(d[i]) * (13 - i);
    return (11 - (sum % 11)) % 10 === Number(d[12]);
  }
  /** จัดรูปแบบช่องกรอกเป็น 1-2345-67890-12-3 ระหว่างพิมพ์ + แสดงสถานะถูก/ผิด */
  function cidInput(el, hintEl) {
    if (!el) return;
    el.setAttribute('inputmode', 'numeric'); el.setAttribute('autocomplete', 'off'); el.setAttribute('maxlength', '17');
    const upd = () => {
      const d = cidDigits(el.value);
      const parts = [d.slice(0, 1), d.slice(1, 5), d.slice(5, 10), d.slice(10, 12), d.slice(12, 13)].filter(Boolean);
      el.value = parts.join('-');
      const ok = isCid(d);
      el.classList.toggle('is-valid', ok);
      el.classList.toggle('is-invalid', d.length === 13 && !ok);
      if (hintEl) hintEl.innerHTML = d.length < 13 ? '<span class="text-muted">' + d.length + '/13 หลัก</span>'
        : ok ? '<span class="text-success"><i class="bi bi-check-circle"></i> รูปแบบถูกต้อง</span>' : '<span class="text-danger"><i class="bi bi-x-circle"></i> เลขบัตรไม่ถูกต้อง (หลักตรวจสอบไม่ตรง)</span>';
    };
    el.addEventListener('input', upd); upd();
  }

  const SB_MIN = 180, SB_MAX = 360, SB_DEF = 240;
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* noop */ } } };
  function sbApply(w) {
    w = Math.min(SB_MAX, Math.max(SB_MIN, w || SB_DEF));
    document.documentElement.style.setProperty('--sbw', w + 'px');
    $('#sbResizer').style.left = w + 'px';

  function sbCollapse(on) {

    store.set('anc_sb_collapsed', on ? '1' : '0');

  }
  sbApply(parseInt(store.get('anc_sb_width'), 10));

  $('#sbCollapse').addEventListener('click', () => sbCollapse(!document.body.classList.contains('sb-collapsed')));
  $('#sbResizer').addEventListener('pointerdown', (ev) => {
    ev.preventDefault();
    const r = $('#sbResizer'); r.classList.add('dragging'); document.body.classList.add('sb-dragging');
    const move = (e) => sbApply(e.clientX);
    const up = (e) => {
      r.classList.remove('dragging'); document.body.classList.remove('sb-dragging');
      store.set('anc_sb_width', String(sbApply(e.clientX)));
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
      window.dispatchEvent(new Event('resize'));
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);

    $$('#menu .nav-link').forEach((a) => a.classList.toggle('active', a.dataset.page === item.id));

    if (needOpts) S.optsReady = api('filterOptions').then((o) => { S.opts = o; }).catch(() => {});

  function destroyCharts() { S.charts.forEach((c) => { try { c.destroy(); } catch (e) { /* noop */ } }); S.charts = []; }

  function pageHeader(title, sub, actionsHtml) {
    const item = MENU.find((m) => m.id === S.page);
    return '<div class="page-head"><div class="d-flex gap-3 align-items-center">' +
      (item && item.icon ? '<div class="ph-icon"><i class="bi bi-' + item.icon + '"></i></div>' : '') +
      '<div><h2>' + esc(title) + '</h2>' + (sub ? '<div class="ph-sub">' + sub + '</div>' : '') + '</div></div>' +
      '<div class="ph-actions">' + (actionsHtml || '') + '</div></div>';
  }

  // =====================================================================
  // Dashboard
  // =====================================================================
  // ---------- ชิ้นส่วน Dashboard ----------
  const nf = (v) => (v === undefined || v === null || v === '') ? '-' : Number(v).toLocaleString('th-TH');
  function stat(label, val, icon, cls, unit, col) {
    return '<div class="' + (col || 'col-6 col-lg-3') + '"><div class="card stat"><div class="icon ' + cls + '"><i class="bi bi-' + icon + '"></i></div>' +
      '<div class="min-w-0"><div class="val">' + nf(val) + (unit ? '<small>' + esc(unit) + '</small>' : '') + '</div><div class="lbl">' + esc(label) + '</div></div></div></div>';
  }
  // kpi() เดิม — ใช้ในหน้าอื่น
  function kpi(label, val, icon, cls) {
    return '<div class="col-6 col-md-4 col-lg-3 col-xxl-2"><div class="card kpi"><div class="icon ' + cls + '"><i class="bi bi-' + icon + '"></i></div>' +
      '<div><div class="val">' + nf(val) + '</div><div class="lbl">' + esc(label) + '</div></div></div></div>';
  }
  /** การ์ด "สิ่งที่ต้องดำเนินการ" — กดแล้วไปหน้ารายการพร้อมตัวกรอง */
  function todoCard(o) {
    const n = Number(o.val) || 0;
    const tag = o.go ? 'button' : 'div';
    return '<div class="col-12 col-sm-6 col-xl"><' + tag + (o.go ? ' type="button" data-go="' + o.go + '"' + (o.preset ? " data-preset='" + esc(JSON.stringify(o.preset)) + "'" : '') : '') +
      ' class="todo-card ' + (n ? 'tone-' + o.tone : 'zero') + '">' +
      '<div class="tc-top"><span class="tc-icon"><i class="bi bi-' + (n ? o.icon : 'check2') + '"></i></span><span class="tc-num">' + nf(n) + '</span></div>' +
      '<div class="tc-lbl">' + esc(o.label) + '</div><div class="tc-help">' + esc(n ? o.help : (o.done || 'ไม่มีรายการค้าง')) + '</div>' +
      (o.go && n ? '<div class="tc-go">' + esc(o.goText || 'ดูรายการ') + ' <i class="bi bi-arrow-right"></i></div>' : '') + '</' + tag + '></div>';
  }
  /** แถบสัดส่วน + คำอธิบาย (เข้าใจง่ายกว่ากราฟวงกลม) */
  function splitCard(title, sub, parts) {
    const total = parts.reduce((a, p) => a + (Number(p.v) || 0), 0);
    const pct = (v) => total ? Math.round((Number(v) || 0) * 100 / total) : 0;
    return '<div class="card split"><h3>' + esc(title) + '</h3><div class="sub">' + esc(sub) + '</div>' +
      '<div class="split-bar" role="img" aria-label="' + esc(title) + '">' + (total ? parts.filter((p) => Number(p.v) > 0).map((p) =>
        '<span style="flex:' + p.v + ';background:' + p.c + '" title="' + esc(p.k + ' ' + p.v) + '"></span>').join('') : '') + '</div>' +
      '<div class="split-legend">' + parts.map((p) => {
        const tag = p.go ? 'button' : 'div';
        return '<' + tag + ' class="it"' + (p.go ? ' type="button" data-go="' + p.go + '"' + (p.preset ? " data-preset='" + esc(JSON.stringify(p.preset)) + "'" : '') : '') + ' style="--c:' + p.c + '">' +
          '<span class="k">' + esc(p.k) + '</span><span class="v">' + nf(p.v) + '<small>' + pct(p.v) + '%</small></span></' + tag + '>';
      }).join('') + '</div></div>';
  }
  function chartCard(id, title, col, sub) {
    return '<div class="' + (col || 'col-md-6 col-xl-4') + '"><div class="card chart-card h-100"><div class="chart-title">' + esc(title) + '</div>' +
      '<div class="chart-sub">' + esc(sub || '') + '</div><div class="chart-box"><canvas id="' + id + '"></canvas></div></div></div>';
  }
  const C = { ok: '#16a34a', bad: '#dc2626', warn: '#f59e0b', brand: '#0f766e', info: '#0e7490', mute: '#94a3b8', pink: '#db2777' };
  /** สีตามความหมายของผลคัดกรอง */
  function statusColors(labels) {
    const reds = ['#dc2626', '#f87171', '#991b1b', '#fca5a5'];
    let r = 0;
    return labels.map((l) => /ปกติ/.test(l) ? C.ok : /เสี่ยง/.test(l) ? reds[r++ % reds.length] : /รอ/.test(l) ? C.warn : C.mute);
  }
  /** 'yyyy-MM' → 'ต.ค. 2569' */
  const fmtMonth = (ym) => { const m = String(ym).match(/^(\d{4})-(\d{2})/); return m ? TH_MONTHS[parseInt(m[2], 10) - 1] + ' ' + (parseInt(m[1], 10) + 543) : ym; };
  if (window.Chart) {
    Chart.defaults.font.family = "'IBM Plex Sans Thai', 'Sarabun', sans-serif";
    Chart.defaults.font.size = 12;
    Chart.defaults.color = '#4a5568';
    Chart.defaults.borderColor = '#eef2f7';
    Chart.defaults.plugins.legend.labels.usePointStyle = true;
    Chart.defaults.plugins.legend.labels.boxWidth = 8;
    Chart.defaults.plugins.tooltip.padding = 10;
    Chart.defaults.plugins.tooltip.cornerRadius = 8;
    Chart.defaults.elements.bar.borderRadius = 6;
  }
  function makeChart(id, type, labels, datasets, extra) {
    const el = document.getElementById(id);
    if (!el) return;
    if (!labels || !labels.length) { el.parentNode.innerHTML = emptyHtml('ยังไม่มีข้อมูล'); return; }
    S.charts.push(new Chart(el, Object.assign({
      type: type, data: { labels: labels, datasets: datasets },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: type === 'doughnut' || datasets.length > 1, position: 'bottom' } },
        scales: type === 'doughnut' ? {} : { x: { grid: { display: false } }, y: { beginAtZero: true, ticks: { precision: 0 } } } }
    }, extra || {})));
  }

      }
      if (d.sync && d.sync.trend) {
        const t = d.sync.trend;
        makeChart('chSync', 'bar', t.labels.map(fmtDate), [
          { label: 'สำเร็จ', data: t.ok, backgroundColor: C.ok, stack: 's', maxBarThickness: 18 },
          { label: 'ล้มเหลว', data: t.fail, backgroundColor: C.bad, stack: 's', maxBarThickness: 18 },
          { label: 'แถวที่เพิ่ม/แก้', data: t.records, type: 'line', borderColor: C.brand, backgroundColor: C.brand, yAxisID: 'y1', tension: .3, pointRadius: 2 }
        ], { options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } },
          scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 }, title: { display: true, text: 'ครั้ง' } }, y1: { position: 'right', beginAtZero: true, grid: { drawOnChartArea: false }, ticks: { precision: 0 }, title: { display: true, text: 'แถว' } } } } });
      }
      $$('#page [data-go]').forEach((b) => b.addEventListener('click', () => {
        let pr = null; try { pr = b.dataset.preset ? JSON.parse(b.dataset.preset) : null; } catch (e) { pr = null; }
        go(b.dataset.go, pr);
      }));
    }).catch((e) => { page.innerHTML = errorHtml(e.message); });
  }

          (personType === 'PARTNER' ? '<th>การเชื่อมโยงคู่</th>' : '') + '<th>การส่งต่อ</th><th class="th-hnote">หมายเหตุจาก รพ.แม่ข่าย</th>' + (isAdminRole() ? '<th>รพ.สต. รับทราบ</th>' : '') + '<th class="text-end">จัดการ</th></tr></thead><tbody>';

      $('#flt [name="dateTo"]').value = isoDate(new Date());
      $('#flt').requestSubmit();

    load();

  function hospNoteCell(r) {
    const ns = r.hospNotes || [];
    if (!ns.length) return '<span class="text-muted small">—</span>';
    const tone = { URGENT: 'nt-urgent', ABNORMAL_LAB: 'nt-bad', FOLLOWUP: 'nt-warn', RETEST: 'nt-warn' };
    return ns.map((n) => '<div class="hn-item ' + (tone[n.NoteType] || 'nt-info') + (n.AckAt ? ' is-done' : '') + '" title="' +
        esc(n.NoteTypeLabel + ' · ' + fmtDateTime(n.CreatedAt) + ' · ' + (n.AuthorName || '') + '\n' + n.Message) + '">' +
      '<div class="hn-top"><span class="badge nt-badge">' + esc(n.NoteTypeLabel) + '</span>' +
      (n.AckAt ? '<i class="bi bi-check2-circle text-success" title="รพ.สต. รับทราบแล้ว"></i>' : '<span class="hn-new">ยังไม่รับทราบ</span>') +
      (n.DueDate ? '<span class="hn-due"><i class="bi bi-calendar-event"></i> ' + fmtDate(n.DueDate) + '</span>' : '') + '</div>' +
      '<div class="hn-msg">' + esc(n.Message) + '</div></div>').join('') +
      (r.hospNotesTotal > ns.length ? '<a href="#" class="small" data-profile="' + esc(r.vn) + '">ดูทั้งหมด ' + r.hospNotesTotal + ' รายการ</a>' : '');
  }

  // =====================================================================
  // ส่งต่อเคส / รับทราบ
  // =====================================================================
  /**
   * ฟอร์มส่งต่อ: กำหนด รพ.สต. แยกรายเคส (ค่าเริ่มต้น = เขตตามที่อยู่, เปลี่ยนข้ามเขตได้ทุกเคส)
   * cases: [{vn, hn, ptname, personType, PCUCode (เขตตามที่อยู่), referral}]
   */
  function referralForm(cases, after, mode) {
    const hospMode = mode === 'HOSPITAL';   // v2.9.26 นัดฟังผลเลือดที่ รพ.แม่ข่าย
    const reasons = (S.opts && S.opts.hospReasons) || HOSP_REASON_TH;
    const cur1 = cases.length === 1 && cases[0].referral && cases[0].referral.hospital ? cases[0].referral.hospital : null;
    const nHospNow = cases.filter((c) => c.referral && c.referral.hospital).length;
    const targets = (S.opts && S.opts.referralTargets) || [];
    if (!targets.length) { Swal.fire({ icon: 'warning', title: 'ไม่พบ รพ.สต. ปลายทาง', text: 'ตรวจสอบข้อมูลหลัก รพ.สต. ของโรงพยาบาล' }); return; }
    const short = (n) => String(n || '').replace('โรงพยาบาลส่งเสริมสุขภาพตำบล', 'รพ.สต.');
    const valid = {}; targets.forEach((t) => { valid[t.code] = t.name; });
    const defOf = (c) => (c.referral && valid[c.referral.PCUCode]) ? c.referral.PCUCode : (valid[c.PCUCode] ? c.PCUCode : '');
    const opts = (c) => {
      const d = defOf(c);
      return '<option value="">— เลือก รพ.สต. —</option>' + targets.map((t) => '<option value="' + esc(t.code) + '"' + (t.code === d ? ' selected' : '') + '>' +
        esc(short(t.name)) + (t.code === c.PCUCode ? ' ★ตามที่อยู่' : '') + '</option>').join('');
    };
    const rowsHtml = cases.map((c, i) => '<tr><td class="small">' + esc(c.ptname || c.vn) + '<div class="muted-sm">HN ' + esc(c.hn || '') + (c.personType ? ' · ' + esc(PERSON_TH[c.personType]) : '') + '</div></td>' +
      '<td class="small">' + esc(valid[c.PCUCode] ? short(valid[c.PCUCode]) : 'นอกเขต') +
      (c.referral ? '<div class="muted-sm">ปัจจุบัน: ' + esc(short(c.referral.PCUName)) + '</div>' : '') + '</td>' +
      '<td><select class="form-select rf-pick rfSel" data-i="' + i + '">' + opts(c) + '</select></td></tr>').join('');
    const hospHtml = !hospMode ? (nHospNow ? '<div class="alert alert-warning py-2 small"><i class="bi bi-exclamation-triangle"></i> ' + nHospNow +

  function pager(res) {
    const from0 = (res.page - 1) * res.pageSize + 1, to0 = Math.min(res.total, res.page * res.pageSize);
    if (res.pages <= 1) return '<div class="tbl-foot"><div class="muted-sm">ทั้งหมด <b>' + res.total + '</b> รายการ</div></div>';
    let h = '<div class="tbl-foot"><div class="muted-sm">แสดง ' + from0 + '–' + to0 + ' จาก <b>' + res.total + '</b> รายการ</div><ul class="pagination pagination-sm mb-0">';
    const from = Math.max(1, res.page - 2), to = Math.min(res.pages, res.page + 2);
    h += '<li class="page-item' + (res.page === 1 ? ' disabled' : '') + '"><a class="page-link" href="#" data-pg="' + (res.page - 1) + '">‹</a></li>';
    for (let p = from; p <= to; p++) h += '<li class="page-item' + (p === res.page ? ' active' : '') + '"><a class="page-link" href="#" data-pg="' + p + '">' + p + '</a></li>';
    h += '<li class="page-item' + (res.page === res.pages ? ' disabled' : '') + '"><a class="page-link" href="#" data-pg="' + (res.page + 1) + '">›</a></li></ul></div>';
    return h;
  }
  function bindPager(res, cb) {
    $$('[data-pg]').forEach((a) => a.addEventListener('click', (ev) => {
      ev.preventDefault();
      const p = parseInt(a.dataset.pg, 10);
      if (p >= 1 && p <= res.pages && p !== res.page) cb(p);
    }));
  }

  // =====================================================================
  // PDF
  // =====================================================================
  function printPdf(vns) {
    if (!vns.length) return;
    // v2.9.18 รพ.สต.: ใช้บัตรผ่านเดิมได้เฉพาะตอนพิมพ์จากหน้าผล LAB ที่เปิดอยู่ ไม่งั้นถามเลขบัตรก่อน
    const reuse = isModalOpen() && ticketCovers(vns);
    if (!reuse && isPcuRole() && isModalOpen()) profileModal().hide(); // บัตรผ่านหมดอายุ → ปิดหน้าต่างก่อนถามเลขบัตร
    (reuse ? Promise.resolve(S.ticket.t) : cidGate(vns, 'PRINT')).then((ticket) => makePdf(vns, ticket))
      .catch((e) => { if (!e.silent) Swal.fire({ icon: 'error', text: e.message }); });
  }

  function makePdf(vns, ticket) {
    Swal.fire({ title: 'กำลังสร้าง PDF...', text: vns.length + ' รายการ', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    api('labPdf', { vns: vns, ticket: ticket || '' }).then((r) => {
      if (!isModalOpen()) S.ticket = null;
      const bin = atob(r.base64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
      const a = document.createElement('a');
      a.href = url; a.download = r.fileName; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      Swal.fire({ icon: 'success', title: 'สร้าง PDF แล้ว', html: 'เลขที่เอกสาร <b>' + esc(r.docNo) + '</b><br><span class="small text-muted">ไฟล์ไม่ถูกเก็บไว้ในระบบ กรุณาจัดเก็บอย่างปลอดภัย</span>' });
    }).catch((e) => {
      if (e.code === 'CID_REQUIRED') { S.ticket = null; Swal.close(); printPdf(vns); return; }
      Swal.fire({ icon: 'error', title: 'สร้าง PDF ไม่สำเร็จ', text: e.message });
    });
  }

  function linkForm(l, after) {
    const isNew = !l;
    l = l || {};
    Swal.fire({
      title: isNew ? 'เพิ่มการเชื่อมโยง' : 'แก้ไขสถานะการเชื่อมโยง',
      width: 760, customClass: { popup: 'lk-dialog' },
      html: '<div class="text-start">' +
        (isNew ? '<label class="form-label small" for="lkP">หญิงตั้งครรภ์ — HN หรือเลขบัตรประชาชน 13 หลัก</label><input id="lkP" class="form-control" maxlength="20" inputmode="numeric" autocomplete="off"><div id="lkPh" class="lk-hint"></div>' +
          '<label class="form-label small" for="lkH">สามี — HN หรือเลขบัตรประชาชน 13 หลัก</label><input id="lkH" class="form-control" maxlength="20" inputmode="numeric" autocomplete="off"><div id="lkHh" class="lk-hint"></div>'
          : '<div class="small mb-2">หญิงตั้งครรภ์ HN ' + esc(l.PregnantHN) + ' · สามี HN ' + esc(l.PartnerHN) + '</div>') +
        '<label class="form-label small">แหล่งอ้างอิงการยืนยันความสัมพันธ์ (เช่น สมุดฝากครรภ์ / ทะเบียนสมรส / HOSxP person_anc)</label><input id="lkR" class="form-control mb-2" maxlength="200" value="' + esc(l.SourceReference || '') + '">' +
        '<label class="form-label small">สถานะ</label><select id="lkS" class="form-select">' +
        Object.keys(LINK_TH).map((k) => '<option value="' + k + '"' + ((l.VerificationStatus || 'PENDING') === k ? ' selected' : '') + '>' + LINK_TH[k] + '</option>').join('') + '</select></div>',
      didOpen: () => {
        if (!isNew) return;
        // v2.9.12 ค้นหาชื่อจาก HN/เลขบัตร ระหว่างพิมพ์ เพื่อยืนยันว่าเลือกถูกคน
        const watch = (inp, hint, want) => {
          let timer = 0, seq = 0;
          const run = () => {
            const q = inp.value.trim();
            const my = ++seq;
            hint.className = 'lk-hint';
            if (!q) { hint.textContent = ''; return; }
            const d = q.replace(/[\s-]/g, '');
            if (/^\d+$/.test(d) && d.length > 9 && d.length < 13) { hint.textContent = 'เลขบัตรประชาชนต้องมี 13 หลัก (ตอนนี้ ' + d.length + ')'; hint.classList.add('is-warn'); return; }
            hint.textContent = 'กำลังค้นหา…';
            api('partnerLookup', { q: q, want: want }).then((r) => {
              if (my !== seq) return;
              if (r.found) { hint.innerHTML = '<i class="bi bi-check-circle-fill"></i> ' + esc(r.name || '-') + ' · HN ' + esc(r.hn); hint.classList.add('is-ok'); }
              else { hint.textContent = r.message || 'ไม่พบ'; hint.classList.add('is-bad'); }
            }).catch(() => { if (my === seq) hint.textContent = ''; });
          };
          inp.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 450); });
        };
        watch($('#lkP'), $('#lkPh'), 'PREGNANT');
        watch($('#lkH'), $('#lkHh'), 'PARTNER');
        $('#lkP').focus();
      },
      showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', showLoaderOnConfirm: true,
      preConfirm: () => api('partnerSave', {
        LinkID: l.LinkID || '', PregnantHN: isNew ? $('#lkP').value.trim() : '', PartnerHN: isNew ? $('#lkH').value.trim() : '',
        SourceReference: $('#lkR').value.trim(), VerificationStatus: $('#lkS').value, RelationshipStatus: 'SPOUSE'
      }).catch((e) => Swal.showValidationMessage(e.message))
    }).then((r) => {
      if (!r.isConfirmed || !r.value) return;
      toast(r.value.autoReferred ? 'บันทึกแล้ว · ส่งข้อมูลคู่ไป รพ.สต. เดียวกันอัตโนมัติ ' + r.value.autoReferred + ' เคส' : 'บันทึกแล้ว');
      after();
    });
  }

  function renderDaily() {
    const state = { date: isoDate(new Date()) };
    $('#page').innerHTML = pageHeader('สรุปการส่งต่อรายวัน', 'จำนวนเคสที่ส่งไปแต่ละ รพ.สต. — MOPH Notify ส่งเฉพาะจำนวน ไม่มีข้อมูลผู้ป่วย',
      (S.user.Role === 'SUPER_ADMIN' ? '<button class="btn btn-primary" id="dySend"><i class="bi bi-send"></i> ส่งสรุปตอนนี้</button>' : '')) +
      '<div class="card filter-card"><div class="row g-2 align-items-end"><div class="col-auto"><label class="form-label small mb-1">วันที่</label>' +
      '<input type="date" id="dyDate" class="form-control" value="' + state.date + '"></div>' +
      '<div class="col-auto"><button class="btn btn-outline-secondary" id="dyPrev">‹ วันก่อน</button> <button class="btn btn-outline-secondary" id="dyNext">วันถัดไป ›</button></div>' +
      '<div class="col text-end muted-sm" id="dyInfo"></div></div></div><div class="card"><div id="tbl"></div></div>';
    function load() {
      $('#tbl').innerHTML = loadingHtml();

        $('#dyInfo').innerHTML = 'ส่งอัตโนมัติประมาณ ' + s.notifyHour + ':00 น. · ' +
          (s.mophEnabled && s.mophHospital ? '<i class="bi bi-chat-dots text-success"></i> MOPH Notify (รพ.)' : '<i class="bi bi-chat-dots"></i> MOPH Notify ยังไม่ได้ตั้ง Key');
        const mo = {}; (s.recipients || []).forEach((x) => { mo[x.PCUCode] = x.moph; });
        const rows = s.rows.slice().sort((a, b) => b.newCases - a.newCases || b.waitingAck - a.waitingAck);
        $('#tbl').innerHTML = '<div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>รพ.สต.</th><th class="text-end">ส่งใหม่วันนี้</th><th class="text-end">หญิงตั้งครรภ์ / สามี</th><th class="text-end">ผลเสี่ยง</th><th class="text-end">ค้างรับทราบผล LAB</th><th class="text-end">หมายเหตุค้าง</th><th class="text-center">MOPH Notify</th></tr></thead><tbody>' +
          rows.map((r) => '<tr' + (r.newCases ? ' class="table-primary"' : '') + '><td>' + esc(String(r.PCUName).replace('โรงพยาบาลส่งเสริมสุขภาพตำบล', 'รพ.สต.')) + '</td>' +
            '<td class="text-end fw-bold">' + r.newCases + '</td><td class="text-end">' + r.newPregnant + ' / ' + r.newPartner + '</td>' +
            '<td class="text-end ' + (r.newRisk ? 'text-danger fw-bold' : '') + '">' + r.newRisk + '</td>' +
            '<td class="text-end ' + (r.waitingAck ? 'text-danger' : '') + '">' + r.waitingAck + '</td><td class="text-end">' + r.notesPending + '</td>' +
            '<td class="text-center">' + (mo[r.PCUCode] ? '<i class="bi bi-check-circle text-success" title="ตั้ง Key ของ รพ.สต. แล้ว"></i>' : '<span class="muted-sm">—</span>') + '</td></tr>').join('') +
          '</tbody><tfoot><tr class="fw-bold"><td>รวม</td><td class="text-end">' + s.total.newCases + '</td><td></td><td class="text-end">' + s.total.newRisk + '</td><td class="text-end">' + s.total.waitingAck + '</td><td class="text-end">' + s.total.notesPending + '</td><td></td></tr></tfoot></table></div>';
      }).catch((e) => { $('#tbl').innerHTML = errorHtml(e.message); });
    }
    const shift = (d) => { const x = new Date(state.date + 'T00:00:00'); x.setDate(x.getDate() + d); state.date = isoDate(x); $('#dyDate').value = state.date; load(); };
    $('#dyDate').addEventListener('change', (e) => { state.date = e.target.value; load(); });
    $('#dyPrev').addEventListener('click', () => shift(-1));
    $('#dyNext').addEventListener('click', () => shift(1));
    if ($('#dySend')) $('#dySend').addEventListener('click', () => {
      Swal.fire({ icon: 'question', title: 'ส่งสรุปของวันที่ ' + fmtDate(state.date) + '?', text: 'ส่ง MOPH Notify (LINE) ถึง รพ.แม่ข่าย และ รพ.สต. ที่ตั้ง Key ไว้ — ไม่ส่งอีเมล', showCancelButton: true, confirmButtonText: 'ส่ง', cancelButtonText: 'ยกเลิก', showLoaderOnConfirm: true,
        preConfirm: () => api('notifySend', { date: state.date }).catch((e) => Swal.showValidationMessage(e.message)) })
        .then((r) => { if (r.isConfirmed && r.value) Swal.fire({ icon: r.value.moph && r.value.moph.failed ? 'warning' : 'success', title: 'ส่งแล้ว', html: 'MOPH Notify ' + (r.value.moph ? r.value.moph.sent : 0) + ' ข้อความ' + (r.value.moph && r.value.moph.failed ? '<br><span class="text-danger">ล้มเหลว ' + r.value.moph.failed + ' (ตรวจ Key)</span>' : '') }); });
    });
    load();
  }

    const row = (k, v) => '<div class="ap-row"><span>' + esc(k) + '</span><b>' + esc(v || '-') + '</b></div>';
    Swal.fire({
      title: 'อนุมัติการสมัครสมาชิก', width: 640,
      html: '<div class="text-start"><div class="ap-box">' + row('ชื่อ-นามสกุล', u.DisplayName) + row('ตำแหน่ง', u.Position) + row('เลขบัตร (ปิดบัง)', u.CIDMasked) +
        row('หน่วยงานที่ขอ', u.RequestedUnit) + row('โทร / อีเมล', [u.Phone, u.Email].filter(Boolean).join(' · ')) + row('ชื่อผู้ใช้', u.Username) + row('สมัครเมื่อ', fmtDateTime(u.RegisteredAt)) + '</div>' +
        '<label class="form-label mt-3">บทบาท *</label><select id="apR" class="form-select"><option value="">— เลือกบทบาท —</option>' +
        m.roles.map((r) => '<option value="' + r + '"' + (reqPcu && r === 'PCU_STAFF' ? ' selected' : '') + '>' + esc(ROLE_TH[r]) + '</option>').join('') + '</select>' +
        '<div id="apCwrap"><label class="form-label mt-2">สังกัด รพ.สต. *</label><select id="apC" class="form-select"><option value="">— เลือก รพ.สต. —</option>' +
        m.pcus.map((p) => '<option value="' + esc(p.code) + '"' + (reqPcu === p.code ? ' selected' : '') + '>' + esc(p.code + ' ' + p.name) + '</option>').join('') + '</select></div>' +
        '<div id="apHwrap"><label class="form-label mt-2">โรงพยาบาล *</label><select id="apH" class="form-select">' +
        m.hospitals.map((h) => '<option value="' + esc(h.code) + '"' + (u.HospitalCode === h.code ? ' selected' : '') + '>' + esc(h.code + ' ' + h.name) + '</option>').join('') + '</select></div>' +
        '<div class="small text-muted mt-2"><i class="bi bi-info-circle"></i> ตรวจสอบตัวตนกับหน่วยงานก่อนอนุมัติ · บันทึกใน Audit_Log</div></div>',
      didOpen: () => {
        const sync = () => { const r = $('#apR').value; $('#apCwrap').style.display = r === 'PCU_STAFF' ? '' : 'none'; $('#apHwrap').style.display = r && r !== 'PCU_STAFF' ? '' : 'none'; };
        $('#apR').addEventListener('change', sync); sync();
      },
      showCancelButton: true, confirmButtonText: '<i class="bi bi-person-check"></i> อนุมัติ', cancelButtonText: 'ยกเลิก', showLoaderOnConfirm: true,
      preConfirm: () => {
        const role = $('#apR').value;
        if (!role) return Swal.showValidationMessage('กรุณาเลือกบทบาท');
        if (role === 'PCU_STAFF' && !$('#apC').value) return Swal.showValidationMessage('กรุณาเลือก รพ.สต. ที่สังกัด');
        return api('userApprove', { UserID: u.UserID, Role: role, PCUCode: $('#apC').value, HospitalCode: $('#apH').value }).catch((e) => Swal.showValidationMessage(e.message));
      }
    }).then((r) => { if (r.isConfirmed && r.value) { toast('อนุมัติแล้ว — ผู้ใช้เข้าสู่ระบบได้ทันที'); after(); } });
  }

  function rejectForm(u, after) {
    Swal.fire({
      icon: 'warning', title: 'ไม่อนุมัติคำขอของ ' + u.DisplayName + '?', input: 'text', inputPlaceholder: 'เหตุผล (ผู้สมัครจะเห็นเมื่อพยายามเข้าสู่ระบบ)', inputAttributes: { maxlength: 200 },
      showCancelButton: true, confirmButtonText: 'ไม่อนุมัติ', confirmButtonColor: '#b91c1c', cancelButtonText: 'ยกเลิก', showLoaderOnConfirm: true,
      preConfirm: (reason) => api('userReject', { UserID: u.UserID, reason: reason }).catch((e) => Swal.showValidationMessage(e.message))
    }).then((r) => { if (r.isConfirmed && r.value) { toast('บันทึกแล้ว'); after(); } });
  }

  function resetPw(userId) {
    Swal.fire({
      title: 'ตั้งรหัสผ่านใหม่', input: 'password', inputPlaceholder: 'รหัสผ่านใหม่ (≥ 8 ตัว มีตัวอักษรและตัวเลข)',
      showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', showLoaderOnConfirm: true,
      preConfirm: (pw) => api('userResetPassword', { UserID: userId, newPassword: pw }).catch((e) => Swal.showValidationMessage(e.message))
    }).then((r) => { if (r.isConfirmed && r.value) toast('ตั้งรหัสผ่านใหม่และปลดล็อกแล้ว'); });
  }

  // =====================================================================
  // Area map
  // =====================================================================
  function renderArea() {
    $('#page').innerHTML = pageHeader('เขตรับผิดชอบ (Area_Map)', 'จับคู่ จังหวัด/อำเภอ/ตำบล/ช่วงหมู่ → รพ.สต. ระบบไม่เดาเขตเอง แถวที่ไม่ตรงจะเป็น UNMAPPED',
      '<button class="btn btn-outline-primary btn-sm" id="btnReassign"><i class="bi bi-arrow-repeat"></i> คำนวณ PCUCode ใหม่ทั้งหมด</button>' +
      '<button class="btn btn-primary btn-sm" id="btnAddArea"><i class="bi bi-plus-lg"></i> เพิ่มเขต</button>') +
      '<div class="row g-3"><div class="col-lg-7"><div class="card"><div class="p-2 fw-semibold">กฎเขตรับผิดชอบ</div><div id="tbl"></div></div></div>' +
      '<div class="col-lg-5"><div class="card"><div class="p-2 fw-semibold">ตำบล/หมู่ที่พบในข้อมูลจริง</div><div id="sum"></div></div></div></div>';
    let master = null;
    function load() {
      $('#tbl').innerHTML = loadingHtml(); $('#sum').innerHTML = loadingHtml();
      Promise.all([api('areaList'), api('areaSummary'), master ? Promise.resolve(master) : api('masterData')]).then(([rows, sum, m]) => {
        master = m;
        $('#tbl').innerHTML = rows.length ? '<div class="table-responsive"><table class="table table-sm mb-0"><thead><tr><th>อำเภอ</th><th>ตำบล</th><th>หมู่</th><th>หมู่บ้าน</th><th>รพ.สต.</th><th>สถานะ</th><th></th></tr></thead><tbody>' +
          rows.slice().sort((x, y) => (x.Amphoe + x.Tambon).localeCompare(y.Amphoe + y.Tambon, 'th') || (Number(x.MooFrom) || 0) - (Number(y.MooFrom) || 0)).map((a) => '<tr><td>' + esc(a.Amphoe) + '</td><td>' + esc(a.Tambon) + '</td><td>' + (a.MooFrom === '' && a.MooTo === '' ? 'ทุกหมู่' : (a.MooFrom === a.MooTo ? esc(a.MooFrom) : esc(a.MooFrom) + '–' + esc(a.MooTo))) + '</td><td class="small">' + esc(a.Note) +
            '</td><td class="small">' + esc(a.PCUName || a.PCUCode) + '</td><td>' + esc(a.Status) + '</td><td><button class="btn btn-sm btn-link" data-a="' + esc(a.AreaID) + '">แก้ไข</button></td></tr>').join('') +
          '</tbody></table></div>' : emptyHtml('ยังไม่มีกฎ — ผู้ใช้ รพ.สต. จะยังไม่เห็นข้อมูล');
        $('#sum').innerHTML = '<div class="table-responsive"><table class="table table-sm mb-0"><thead><tr><th>พื้นที่</th><th>หมู่ที่พบ</th><th class="text-end">แถว</th><th class="text-end">จับคู่แล้ว</th><th></th></tr></thead><tbody>' +
          sum.map((s) => '<tr><td class="small">' + esc(s.key) + '</td><td class="small">' + esc(s.moos.join(', ')) + '</td><td class="text-end">' + s.count + '</td><td class="text-end">' + s.mapped + '</td><td>' +
            (s.foreign ? '' : '<button class="btn btn-sm btn-link p-0" data-pre="' + esc(JSON.stringify({ Changwat: s.changwat, Amphoe: s.amphoe, Tambon: s.tambon })) + '">+</button>') + '</td></tr>').join('') + '</tbody></table></div>';
        $$('#tbl [data-a]').forEach((b) => b.addEventListener('click', () => areaForm(rows.find((x) => x.AreaID === b.dataset.a), master, load)));
        $$('#sum [data-pre]').forEach((b) => b.addEventListener('click', () => areaForm(Object.assign({ Status: 'ACTIVE', MooFrom: '', MooTo: '' }, JSON.parse(b.dataset.pre)), master, load, true)));
      }).catch((e) => { $('#tbl').innerHTML = errorHtml(e.message); $('#sum').innerHTML = ''; });
    }
    $('#btnAddArea').addEventListener('click', () => (master ? Promise.resolve(master) : api('masterData')).then((m) => { master = m; areaForm(null, m, load); }));
    $('#btnReassign').addEventListener('click', () => {
      Swal.fire({ icon: 'question', title: 'คำนวณ PCUCode ใหม่ทุกแถว?', text: 'ใช้กฎ Area_Map ปัจจุบัน สิทธิ์การมองเห็นของ รพ.สต. จะเปลี่ยนตามผลลัพธ์', showCancelButton: true, confirmButtonText: 'ดำเนินการ', cancelButtonText: 'ยกเลิก' })
        .then((r) => {
          if (!r.isConfirmed) return;
          Swal.fire({ title: 'กำลังประมวลผล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
          api('areaReassign').then((x) => { Swal.fire({ icon: 'success', title: 'เสร็จแล้ว', html: 'ทั้งหมด ' + x.total + ' แถว · เปลี่ยน ' + x.changed + ' แถว' }); load(); })
            .catch((e) => Swal.fire({ icon: 'error', title: 'ไม่สำเร็จ', text: e.message }));
        });
    });
    load();
  }

  function areaForm(a, m, after, isPreset) {
    const isNew = !a || isPreset; a = a || { Status: 'ACTIVE', MooFrom: '', MooTo: '' };
    Swal.fire({
      title: isNew ? 'เพิ่มเขตรับผิดชอบ' : 'แก้ไขเขตรับผิดชอบ',
      html: '<div class="text-start row g-2">' +
        '<div class="col-4"><label class="form-label small">จังหวัด</label><input id="aC" class="form-control" value="' + esc(a.Changwat || '') + '"></div>' +
        '<div class="col-4"><label class="form-label small">อำเภอ</label><input id="aA" class="form-control" value="' + esc(a.Amphoe || '') + '"></div>' +
        '<div class="col-4"><label class="form-label small">ตำบล *</label><input id="aT" class="form-control" value="' + esc(a.Tambon || '') + '"></div>' +
        '<div class="col-6"><label class="form-label small">หมู่ตั้งแต่ (ว่าง = ทุกหมู่)</label><input id="aF" type="number" min="0" class="form-control" value="' + esc(a.MooFrom) + '"></div>' +
        '<div class="col-6"><label class="form-label small">ถึงหมู่</label><input id="aTo" type="number" min="0" class="form-control" value="' + esc(a.MooTo) + '"></div>' +
        '<div class="col-12"><label class="form-label small">รพ.สต. *</label><select id="aP" class="form-select">' + m.pcus.map((p) => '<option value="' + esc(p.code) + '"' + (a.PCUCode === p.code ? ' selected' : '') + '>' + esc(p.code + ' ' + p.name) + '</option>').join('') + '</select></div>' +
        '<div class="col-6"><label class="form-label small">สถานะ</label><select id="aS" class="form-select"><option value="ACTIVE">ACTIVE</option><option value="INACTIVE"' + (a.Status === 'INACTIVE' ? ' selected' : '') + '>INACTIVE</option></select></div>' +
        '<div class="col-6"><label class="form-label small">ชื่อหมู่บ้าน / หมายเหตุ</label><input id="aN" class="form-control" value="' + esc(a.Note || '') + '"></div></div>',
      width: 640, showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', showLoaderOnConfirm: true,
      preConfirm: () => api('areaSave', {
        AreaID: isNew ? '' : a.AreaID, Changwat: $('#aC').value, Amphoe: $('#aA').value, Tambon: $('#aT').value,
        MooFrom: $('#aF').value, MooTo: $('#aTo').value, PCUCode: $('#aP').value, Status: $('#aS').value, Note: $('#aN').value
      }).catch((e) => Swal.showValidationMessage(e.message))
    }).then((r) => { if (r.isConfirmed && r.value) { toast('บันทึกแล้ว — กด "คำนวณ PCUCode ใหม่" เพื่อใช้กฎกับข้อมูลเดิม'); after(); } });
  }

  // =====================================================================
  // Config
  // =====================================================================
  function renderConfig() {
    $('#page').innerHTML = pageHeader('ตั้งค่าระบบ (System_Config)', 'Secret เก็บใน Script Properties เท่านั้น ไม่แสดงในหน้านี้') + '<div class="card"><div id="tbl"></div></div>';
    function load() {
      $('#tbl').innerHTML = loadingHtml();
      api('configList').then((rows) => {
        $('#tbl').innerHTML = '<div class="table-responsive"><table class="table table-sm mb-0"><thead><tr><th>Key</th><th>ค่า</th><th>คำอธิบาย</th><th>แก้ไขล่าสุด</th><th></th></tr></thead><tbody>' +
          rows.map((c) => '<tr><td class="small fw-semibold">' + esc(c.ConfigKey) + '</td><td class="small">' + esc(c.ConfigValue) + '</td><td class="small">' + esc(c.Description) + '</td><td class="small">' + fmtDateTime(c.UpdatedAt) + ' ' + esc(c.UpdatedBy) +
            '</td><td><button class="btn btn-sm btn-link" data-k="' + esc(c.ConfigKey) + '">แก้ไข</button></td></tr>').join('') + '</tbody></table></div>';
        $$('#tbl [data-k]').forEach((b) => b.addEventListener('click', () => {
          const c = rows.find((x) => x.ConfigKey === b.dataset.k);
          Swal.fire({
            title: c.ConfigKey, text: c.Description, input: 'text', inputValue: c.ConfigValue, showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', showLoaderOnConfirm: true,
            preConfirm: (v) => api('configSave', { ConfigKey: c.ConfigKey, ConfigValue: v }).catch((e) => Swal.showValidationMessage(e.message))
          }).then((r) => { if (r.isConfirmed && r.value) { toast('บันทึกแล้ว'); load(); } });
        }));
      }).catch((e) => { $('#tbl').innerHTML = errorHtml(e.message); });
    }
    load();
  }

  // =====================================================================
  // Audit
  // =====================================================================
  function renderAudit() {
    const state = { page: 1, pageSize: 50, log: 'AUDIT', q: '', dateFrom: daysAgo(30), dateTo: isoDate(new Date()) };
    $('#page').innerHTML = pageHeader('Audit / Access Log', 'บันทึกการใช้งานและการเข้าถึงข้อมูล') +
      '<div class="card filter-card"><form id="auF" class="row g-2 align-items-end"><div class="col-6 col-md-2"><select name="log" class="form-select"><option value="AUDIT">Audit Log</option><option value="ACCESS">Access Log</option></select></div>' +
      '<div class="col-6 col-md-2"><input type="date" name="dateFrom" class="form-control" value="' + state.dateFrom + '"></div><div class="col-6 col-md-2"><input type="date" name="dateTo" class="form-control" value="' + state.dateTo + '"></div>' +
      '<div class="col-6 col-md-3"><input name="q" class="form-control" placeholder="ค้นหา UserID / Action / Key"></div><div class="col-auto"><button class="btn btn-primary">ค้นหา</button></div></form></div>' +
      '<div class="card"><div id="tbl"></div></div>';
    function load() {
      $('#tbl').innerHTML = loadingHtml();
      api('auditList', state).then((res) => {
        if (!res.items.length) { $('#tbl').innerHTML = emptyHtml(); return; }
        const cols = Object.keys(res.items[0]);
        $('#tbl').innerHTML = '<div class="table-responsive"><table class="table table-sm mb-0"><thead><tr>' + cols.map((c) => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
          res.items.map((r) => '<tr>' + cols.map((c) => '<td class="small">' + (c === 'Timestamp' ? fmtDateTime(r[c]) : esc(r[c])) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>' + pager(res);
        bindPager(res, (p) => { state.page = p; load(); });
      }).catch((e) => { $('#tbl').innerHTML = errorHtml(e.message); });
    }
    $('#auF').addEventListener('submit', (ev) => { ev.preventDefault(); const f = new FormData(ev.target); ['log', 'dateFrom', 'dateTo', 'q'].forEach((k) => { state[k] = f.get(k); }); state.page = 1; load(); });
    load();
  }

  // =====================================================================
  // Global delegated events
  // =====================================================================
  document.addEventListener('click', (ev) => {
    const prof = ev.target.closest('[data-profile]');
    if (prof) { ev.preventDefault(); openProfile(prof.dataset.profile); return; }
    const pdf = ev.target.closest('[data-pdf]');
    if (pdf) { ev.preventDefault(); printPdf([pdf.dataset.pdf]); return; }
    const rl = ev.target.closest('[data-act="reload"]');
    if (rl) { ev.preventDefault(); go(S.page || 'dashboard'); }
  });

  // =====================================================================
  // Boot: กู้ Session เดิม (ถ้ายังไม่หมดอายุ)
  // =====================================================================
  const saved = readToken();
  if (saved) {
    S.token = saved;
    api('me').then((u) => { S.user = u; S.loginAt = null; startApp(); }).catch(() => { S.token = null; saveToken(null); showLogin(); });
  } else {
    showLogin();
  }
})();
</script>
